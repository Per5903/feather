[package]
name = "feather-server"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
feather-protocol = { path = "../crates/protocol" }
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.3"
# Коды двухфакторной защиты (TOTP, RFC 6238)
hmac = "0.12"
sha1 = "0.10"
# Превью картинок: только нужные декодеры, JPEG для превью
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
livekit-api = { version = "0.8", default-features = false, features = ["access-token"] }
# Превью ссылок: сервер сам скачивает начало страницы
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = "0.30"
