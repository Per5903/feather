[workspace]
resolver = "3"
members = ["bench/denoise", "crates/protocol", "client/core", "server", "client/desktop", "client/native", "client/voice-proto", "client/ptt-proto"]

# Релизная сборка оптимизирована по размеру: клиент должен быть лёгким
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
