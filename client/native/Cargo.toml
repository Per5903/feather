[package]
name = "feather-native"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "feather"
path = "src/main.rs"

[dependencies]
feather-core = { path = "../core" }
feather-protocol = { path = "../../crates/protocol" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Декодирование превью вложений (сервер отдаёт JPEG)
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Без Qt-бэкенда: winit + рендереры OpenGL (по умолчанию, D13) и программный («экономный режим»)
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# Только для снимков окна в режиме FEATHER_SNAPSHOT (проверки и скриншоты)
png = "0.18"

[build-dependencies]
slint-build = "1.18"
# Иконка и сведения о программе в feather.exe (используется только при сборке под Windows)
winresource = "0.1"
