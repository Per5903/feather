[package]
name = "feather-core"
version = "0.0.1"
edition = "2024"
publish = false
description = "Ядро клиента Feather без UI: REST API и realtime-шлюз (задел на SDK, docs/01-vision.md)"

[dependencies]
feather-protocol = { path = "../../crates/protocol" }
futures-util = "0.3"
# В зависимостях оказываются оба криптобэкенда TLS (aws-lc-rs от reqwest, ring от LiveKit) —
# rustls тогда не может выбрать сам и падает на первом wss://. Выбираем явно: tls::init()
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# Голос (docs/06-voice.md, D17): свой аудиотракт вокруг LiveKit
livekit = { version = "0.9", features = ["rustls-tls-native-roots"] }
cpal = "0.18"
nnnoiseless = "0.5"
ringbuf = "0.4"
# Буфер обмена: вставка скриншота Ctrl+V, копирование
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Токен входа — в системном хранилище ключей (Secret Service / Windows Credential Manager)
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

# Глобальный push-to-talk на Linux/Wayland через XDG-портал (D15)
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts", "notification", "file_chooser"] }
# PulseAudio/PipeWire: правильное имя приложения и выбор устройств (замер 5)
cpal = { version = "0.18", features = ["pulseaudio"] }

# Windows: push-to-talk опросом клавиш, системные уведомления, диалог выбора файлов
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
tauri-winrt-notification = "0.8"
rfd = { version = "0.17", default-features = false }
