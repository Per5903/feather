# Feather на своём сервере: всё в одном файле.
#   1) ./setup.sh ваш.домен      — создаст .env с паролями и ключами
#   2) docker compose up -d       — HTTPS-сертификат Caddy получит сам
# Подробно: docs/11-selfhost.md
name: feather

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    extra_hosts:
      # LiveKit работает в сети хоста (нужно для UDP); Caddy достаёт его через шлюз
      - "host.docker.internal:host-gateway"
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: feather-server:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://feather:${POSTGRES_PASSWORD}@postgres:5432/feather
      LIVEKIT_URL: wss://${DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Сервер за Caddy: настоящий IP клиента — в X-Forwarded-For (для лимитов частоты)
      FEATHER_TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: feather
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feather -d feather"]
      interval: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  pgdata:
  caddy_data:
