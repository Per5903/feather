# Feather на своём сервере: всё в одном файле.
#   1) ./setup.sh ваш.домен      — создаст .env с паролями и ключами
#   2) docker compose up -d       — HTTPS-сертификат Caddy получит сам
# Подробно: docs/11-selfhost.md
name: feather

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: feather-server:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://feather:${POSTGRES_PASSWORD}@postgres:5432/feather
      LIVEKIT_URL: wss://${DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Сервер за Caddy: настоящий IP клиента — в X-Forwarded-For (для лимитов частоты)
      FEATHER_TRUST_PROXY: "1"
      # Кто может регистрироваться: open | invite (только по коду приглашения) | closed
      FEATHER_REGISTRATION: ${FEATHER_REGISTRATION:-open}
    volumes:
      - files:/data   # вложения
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: feather
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feather -d feather"]
      interval: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    # Сигнализация (7880) — только внутри сети compose, наружу через Caddy (HTTPS).
    # Наружу — лишь медиа: один UDP-порт и запасной TCP.
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # Резервные копии: база и файлы раз в FEATHER_BACKUP_HOURS часов (24) в ./backups,
  # хранятся последние FEATHER_BACKUP_KEEP (7). Восстановление — docs/11-selfhost.md
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      HOURS: ${FEATHER_BACKUP_HOURS:-24}
      KEEP: ${FEATHER_BACKUP_KEEP:-7}
    volumes:
      - ./backups:/backups
      - files:/files:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 60
        while true; do
          t=$$(date +%Y%m%d-%H%M)
          if pg_dump -h postgres -U feather -Fc feather > /backups/db-$$t.dump.tmp; then
            mv /backups/db-$$t.dump.tmp /backups/db-$$t.dump
            tar -czf /backups/files-$$t.tar.gz -C /files . && echo "копия $$t готова"
          else
            rm -f /backups/db-$$t.dump.tmp; echo "копия базы $$t не удалась"
          fi
          # Старые копии: оставляем последние KEEP
          ls -1t /backups/db-*.dump 2>/dev/null | tail -n +$$((KEEP + 1)) | xargs -r rm -f
          ls -1t /backups/files-*.tar.gz 2>/dev/null | tail -n +$$((KEEP + 1)) | xargs -r rm -f
          sleep $$((HOURS * 3600))
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  files:
