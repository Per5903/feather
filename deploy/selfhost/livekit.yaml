# LiveKit для сервера в интернете. Ключи — из переменной LIVEKIT_KEYS (.env).
port: 7880           # сигнализация; наружу не открыт, только через Caddy (HTTPS)
rtc:
  tcp_port: 7881     # запасной путь для медиа через TCP
  udp_port: 7882     # все медиапотоки через один UDP-порт: проще файрвол
  use_external_ip: true
logging:
  level: info
room:
  empty_timeout: 300
